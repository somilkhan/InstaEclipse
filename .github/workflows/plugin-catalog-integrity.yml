name: Plugin Catalog Integrity

on:
  push:
    branches:
      - stability/latest-instagram
    paths:
      - "plugins/catalog.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-catalog-integrity
  cancel-in-progress: false

jobs:
  sync:
    name: Sync published plugin digests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stability/latest-instagram
          fetch-depth: 1

      - name: Sync SHA-256 values from published releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          changed=false
          while IFS= read -r entry; do
            id=$(jq -r '.id' <<<"$entry")
            version=$(jq -r '.version' <<<"$entry")
            tag="plugin/${id}/v${version}"
            checksum=$(gh release download "$tag" -p SHA256SUMS-release.txt -O - 2>/dev/null | awk '{print $1}' | head -n1 || true)
            if [[ "$checksum" =~ ^[0-9a-fA-F]{64}$ ]]; then
              checksum=${checksum,,}
              tmp=$(mktemp)
              jq --arg id "$id" --arg checksum "$checksum" '.plugins |= map(if .id == $id then .sha256=$checksum else . end)' plugins/catalog.json > "$tmp"
              if ! cmp -s "$tmp" plugins/catalog.json; then
                mv "$tmp" plugins/catalog.json
                changed=true
              else
                rm -f "$tmp"
              fi
            fi
          done < <(jq -c '.plugins[]? | select(.remote == true and .id != null and .version != null)' plugins/catalog.json)

          if [[ "$changed" == "true" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/catalog.json
            git commit -m "chore(plugin): sync published catalog digests"
            git push origin stability/latest-instagram
          fi

      - name: Validate catalog integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema == 1 and
            (.plugins | type == "array") and
            all(.[]; (.remote != true) or ((.sha256 // "") | test("^[0-9a-fA-F]{64}$")))
          ' plugins/catalog.json >/dev/null
