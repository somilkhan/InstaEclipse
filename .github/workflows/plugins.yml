name: Plugin Packs

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin id (for example pfp-downloader)"
        required: true
        type: string
      version:
        description: "Semver release version (for example 1.2.0)"
        required: true
        type: string
  push:
    branches:
      - stability/latest-instagram
    paths:
      - "plugin-*/**"
      - "plugins/**"
      - "plugin-api/**"
    tags:
      - "plugin/*/v*"

permissions:
  contents: write

env:
  PLUGIN_ROOT: plugins
  CATALOG_BRANCH: stability/latest-instagram

concurrency:
  group: plugin-packs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-plugins:
    name: Verify plugin packs
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0

      - name: Validate canonical plugin definitions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=("$PLUGIN_ROOT"/*/plugin.json)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            jq -e '
              .schema == 1 and
              (.id | type == "string" and test("^[a-z0-9][a-z0-9._-]*$")) and
              (.name | type == "string" and length > 0) and
              (.description | type == "string") and
              (.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
              (.min_core_api | type == "number") and
              (.max_core_api | type == "number") and
              (.entrypoint | type == "string" and length > 0) and
              (.packageName | type == "string" and length > 0) and
              (.min_instagram_version | type == "number") and
              (.max_instagram_version | type == "number") and
              (.module | type == "string" and test("^[A-Za-z0-9._-]+$"))
            ' "$manifest" >/dev/null
            module=$(jq -r '.module' "$manifest")
            test -d "$module" || { echo "Missing Gradle module: $module"; exit 1; }
          done

      - name: Materialize plugin manifests for CI builds
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            module=$(jq -r '.module' "$manifest")
            target="$module/src/main/assets/plugin.json"
            mkdir -p "$(dirname "$target")"
            cp "$manifest" "$target"
          done < <(find plugins -mindepth 2 -maxdepth 2 -name plugin.json -print | sort)

      - name: Build every plugin pack
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          while IFS= read -r module; do
            echo "==> Building :${module}:assembleDebug"
            ./gradlew ":${module}:assembleDebug" --no-daemon
          done < <(find . -maxdepth 1 -type d -name 'plugin-*' ! -name 'plugin-api' -printf '%f\n' | sort)

      - name: Upload debug plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-plugin-debug-${{ github.sha }}
          path: plugin-*/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release-plugin:
    name: Release plugin pack
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/plugin/') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve plugin id and version
        shell: bash
        run: |
          set -euo pipefail
          ID=""
          VERSION=""
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            ID="${{ inputs.plugin }}"
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/plugin/* ]]; then
            REF="${GITHUB_REF_NAME}"
            [[ "$REF" =~ ^plugin/([^/]+)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "Tag must be plugin/<id>/v<major>.<minor>.<patch>"; exit 1; }
            ID="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"
          else
            candidates=()
            while IFS= read -r manifest; do
              id=$(jq -r '.id' "$manifest")
              remote=$(jq -r '.remote // false' "$manifest")
              version=$(jq -r '.version' "$manifest")
              current=$(jq -r --arg id "$id" '.plugins[]? | select(.id == $id) | .version' plugins/catalog.json 2>/dev/null | head -n1 || true)
              if [[ "$remote" == "true" && "$version" != "$current" ]]; then
                candidates+=("$id|$version")
              fi
            done < <(find plugins -mindepth 2 -maxdepth 2 -name plugin.json -print | sort)
            if ((${#candidates[@]} == 0)); then
              echo "No plugin manifest version is ahead of the live catalog; skipping release."
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
              exit 0
            fi
            IFS=$'\n' sorted=($(printf '%s\n' "${candidates[@]}" | sort))
            IFS='|' read -r ID VERSION <<< "${sorted[0]}"
          fi
          [[ "$ID" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "Invalid plugin id"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be semver X.Y.Z"; exit 1; }
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "PLUGIN_ID=$ID" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Load canonical plugin definition
        if: ${{ env.SKIP_RELEASE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$PLUGIN_ROOT/$PLUGIN_ID/plugin.json"
          [[ -f "$MANIFEST" ]] || { echo "Missing $MANIFEST"; exit 1; }
          jq -e --arg id "$PLUGIN_ID" --arg version "$PLUGIN_VERSION" '
            .schema == 1 and
            .id == $id and
            .version == $version and
            (.module | type == "string" and test("^[A-Za-z0-9._-]+$")) and
            (.packageName | type == "string" and length > 0)
          ' "$MANIFEST" >/dev/null
          PLUGIN_MODULE=$(jq -r '.module' "$MANIFEST")
          [[ -d "$PLUGIN_MODULE" ]] || { echo "Missing Gradle module: $PLUGIN_MODULE"; exit 1; }
          echo "PLUGIN_MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
          echo "PLUGIN_MODULE=$PLUGIN_MODULE" >> "$GITHUB_ENV"
          cp "$MANIFEST" /tmp/plugin-release-manifest.json

      - name: Set up JDK 17
        if: ${{ env.SKIP_RELEASE != 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: ${{ env.SKIP_RELEASE != 'true' }}
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0

      - name: Materialize release version into plugin manifest
        if: ${{ env.SKIP_RELEASE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$PLUGIN_MODULE/src/main/assets/plugin.json"
          mkdir -p "$(dirname "$TARGET")"
          cp "$PLUGIN_MANIFEST" "$TARGET"

      - name: Build debug artifact
        if: ${{ env.SKIP_RELEASE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew ":$PLUGIN_MODULE:assembleDebug" -PpluginVersion="$PLUGIN_VERSION" -PpluginVersionCode="$PLUGIN_VERSION_CODE" --no-daemon

      - name: Build and sign release artifact
        if: ${{ env.SKIP_RELEASE != 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.INSTAECLIPSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Release signing secrets are required'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/instaeclipse-release.jks
          ./gradlew ":$PLUGIN_MODULE:assembleRelease" --no-daemon \
            -PpluginVersion="$PLUGIN_VERSION" -PpluginVersionCode="$PLUGIN_VERSION_CODE" \
            -PpluginReleaseStoreFile=/tmp/instaeclipse-release.jks \
            -PpluginReleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PpluginReleaseKeyAlias="$KEY_ALIAS" \
            -PpluginReleaseKeyPassword="$KEY_PASSWORD"
          mkdir -p dist
          APK="dist/instaeclipse-${PLUGIN_ID}-${PLUGIN_VERSION}.apk"
          cp "$PLUGIN_MODULE/build/outputs/apk/release/${PLUGIN_MODULE}-release.apk" "$APK"
          PACKAGE_NAME=$(aapt dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          EXPECTED_PACKAGE=$(jq -r '.packageName' /tmp/plugin-release-manifest.json)
          test "$PACKAGE_NAME" = "$EXPECTED_PACKAGE" || { echo "APK packageName mismatch: $PACKAGE_NAME != $EXPECTED_PACKAGE"; exit 1; }
          sha256sum "$APK" > dist/SHA256SUMS-release.txt
          command -v apksigner >/dev/null 2>&1 || { echo 'apksigner not found on runner'; exit 1; }
          apksigner verify --verbose "$APK"

      - name: Publish GitHub release
        if: ${{ env.SKIP_RELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "plugin/${PLUGIN_ID}/v${PLUGIN_VERSION}" \
            "dist/instaeclipse-${PLUGIN_ID}-${PLUGIN_VERSION}.apk" dist/SHA256SUMS-release.txt \
            --title "${PLUGIN_ID} ${PLUGIN_VERSION}" \
            --notes "Signed InstaEclipse executable plugin. Requires the compatible InstaEclipse Core API and signing identity declared by the plugin manifest."

      - name: Update live catalog
        if: ${{ env.SKIP_RELEASE != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$CATALOG_BRANCH"
          git checkout "$CATALOG_BRANCH"
          MANIFEST="$PLUGIN_ROOT/$PLUGIN_ID/plugin.json"
          TAG="plugin/${PLUGIN_ID}/v${PLUGIN_VERSION}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          APK="instaeclipse-${PLUGIN_ID}-${PLUGIN_VERSION}.apk"
          ENTRY=$(jq --arg version "$PLUGIN_VERSION" --arg apk "$APK" --arg base "$BASE" '.version=$version | .download_url=(($base)+"/"+$apk) | .sha256_url=(($base)+"/SHA256SUMS-release.txt") | .remote=true | del(.schema,.module)' "$MANIFEST")
          jq --arg id "$PLUGIN_ID" --argjson entry "$ENTRY" '.catalog_version=((.catalog_version // 0)+1) | .schema=1 | .plugins=([.plugins[]? | select(.id != $id)] + [$entry] | sort_by(.id))' plugins/catalog.json > /tmp/catalog.json
          mv /tmp/catalog.json plugins/catalog.json
          git add plugins/catalog.json
          git commit -m "chore(plugin): publish ${PLUGIN_ID} v${PLUGIN_VERSION} to catalog"
          git push origin "$CATALOG_BRANCH"
