name: Plugin Packs

on:
  workflow_dispatch:
  push:
    tags:
      - 'plugin-*'

permissions:
  contents: write

env:
  PLUGIN_VERSION: '1.0.0'

jobs:
  pfp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew :plugin-pfp:assembleDebug --no-daemon

      - name: Verify plugin manifest
        run: |
          test -f plugin-pfp/src/main/assets/plugin.json
          grep -q '"id": "pfp-downloader"' plugin-pfp/src/main/assets/plugin.json
          grep -q '"version": "1.0.0"' plugin-pfp/src/main/assets/plugin.json

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp plugin-pfp/build/outputs/apk/debug/plugin-pfp-debug.apk dist/instaeclipse-pfp-1.0.0-debug.apk
          sha256sum dist/instaeclipse-pfp-1.0.0-debug.apk | tee dist/SHA256SUMS.txt

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-pfp-1.0.0
          path: dist/*

      - name: Publish release asset on plugin tag
        if: startsWith(github.ref, 'refs/tags/plugin-') && secrets.INSTAECLIPSE_KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.INSTAECLIPSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/instaeclipse-release.jks
          ./gradlew :plugin-pfp:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/instaeclipse-release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp plugin-pfp/build/outputs/apk/release/plugin-pfp-release.apk dist/instaeclipse-pfp-1.0.0.apk
          sha256sum dist/instaeclipse-pfp-1.0.0.apk > dist/SHA256SUMS-release.txt
          gh release create "$GITHUB_REF_NAME" dist/instaeclipse-pfp-1.0.0.apk dist/SHA256SUMS-release.txt \
            --title "PFP Downloader Pack $PLUGIN_VERSION" \
            --notes "Signed executable InstaEclipse plugin pack. Requires InstaEclipse Core API 1 and a matching core signing certificate."
