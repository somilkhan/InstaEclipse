name: Plugin Packs

on:
  workflow_dispatch:
  push:
    tags:
      - 'plugin-*'

permissions:
  contents: write

env:
  PLUGIN_ID: pfp-downloader
  PLUGIN_VERSION: '1.0.0'
  PLUGIN_VERSION_CODE: '10000'

jobs:
  pfp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve plugin version from tag
        if: startsWith(github.ref, 'refs/tags/plugin-')
        run: |
          VERSION="${GITHUB_REF_NAME#plugin-}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "PLUGIN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PLUGIN_VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Materialize plugin version metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('plugin-pfp/src/main/assets/plugin.json')
          data = json.loads(path.read_text())
          data['version'] = '${{ env.PLUGIN_VERSION }}'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Build unsigned plugin
        run: |
          chmod +x ./gradlew
          ./gradlew :plugin-pfp:assembleDebug -PpluginVersion="$PLUGIN_VERSION" -PpluginVersionCode="$PLUGIN_VERSION_CODE" --no-daemon
          mkdir -p dist
          cp plugin-pfp/build/outputs/apk/debug/plugin-pfp-debug.apk "dist/instaeclipse-pfp-${PLUGIN_VERSION}-debug.apk"
          sha256sum "dist/instaeclipse-pfp-${PLUGIN_VERSION}-debug.apk" | tee dist/SHA256SUMS-debug.txt

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-pfp-${{ env.PLUGIN_VERSION }}-debug
          path: dist/*

      - name: Require release signing configuration
        if: startsWith(github.ref, 'refs/tags/plugin-')
        env:
          KEYSTORE_B64: ${{ secrets.INSTAECLIPSE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo 'Missing INSTAECLIPSE_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing INSTAECLIPSE_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing INSTAECLIPSE_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing INSTAECLIPSE_KEY_PASSWORD'; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/instaeclipse-release.jks

      - name: Build signed release plugin
        if: startsWith(github.ref, 'refs/tags/plugin-')
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
        run: |
          ./gradlew :plugin-pfp:assembleRelease --no-daemon \
            -PpluginVersion="$PLUGIN_VERSION" \
            -PpluginVersionCode="$PLUGIN_VERSION_CODE" \
            -PpluginReleaseStoreFile=/tmp/instaeclipse-release.jks \
            -PpluginReleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PpluginReleaseKeyAlias="$KEY_ALIAS" \
            -PpluginReleaseKeyPassword="$KEY_PASSWORD"
          cp "plugin-pfp/build/outputs/apk/release/plugin-pfp-release.apk" "dist/instaeclipse-pfp-${PLUGIN_VERSION}.apk"
          sha256sum "dist/instaeclipse-pfp-${PLUGIN_VERSION}.apk" > dist/SHA256SUMS-release.txt

      - name: Verify release APK is signed
        if: startsWith(github.ref, 'refs/tags/plugin-')
        run: apksigner verify --verbose "dist/instaeclipse-pfp-${PLUGIN_VERSION}.apk"

      - name: Publish plugin release
        if: startsWith(github.ref, 'refs/tags/plugin-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/instaeclipse-pfp-${PLUGIN_VERSION}.apk" \
            dist/SHA256SUMS-release.txt \
            --title "PFP Downloader Pack ${PLUGIN_VERSION}" \
            --notes "Signed executable InstaEclipse plugin pack. Requires InstaEclipse Core API 1 and the same signing certificate as the installed InstaEclipse core."
