name: InstaEclipse Android Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\([^'\"]*\)['\"].*/\1/p" app/build.gradle | head -n1)
          CODE=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n1)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          [[ "$CODE" =~ ^[0-9]+$ ]] || { echo "Invalid versionCode: $CODE"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Skip duplicate release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "manager/v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "manager/v${VERSION} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.existing.outputs.exists != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        if: steps.existing.outputs.exists != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.0 platforms;android-35

      - name: Validate Gradle wrapper
        if: steps.existing.outputs.exists != 'true'
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        if: steps.existing.outputs.exists != 'true'
        run: chmod +x ./gradlew

      - name: Run tests and lint
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Prepare signing key
        if: steps.existing.outputs.exists != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.INSTAECLIPSE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "INSTAECLIPSE_KEYSTORE_BASE64 is required"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/instaeclipse-release.jks
          test -s /tmp/instaeclipse-release.jks

      - name: Build signed release APK
        if: steps.existing.outputs.exists != 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PcoreReleaseStoreFile=/tmp/instaeclipse-release.jks \
            -PcoreReleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PcoreReleaseKeyAlias="$KEY_ALIAS" \
            -PcoreReleaseKeyPassword="$KEY_PASSWORD"

      - name: Verify and checksum APK
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          ! unzip -l "$APK" | grep -q 'assets/web/index.html'
          "$APKSIGNER" verify --verbose "$APK"
          PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          test "$PACKAGE" = "ps.reso.instaeclipse"
          test "$VERSION" = "${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp "$APK" "dist/instaeclipse-${VERSION}.apk"
          sha256sum "dist/instaeclipse-${VERSION}.apk" > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "manager/v${VERSION}" \
            "dist/instaeclipse-${VERSION}.apk" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "InstaEclipse Android ${VERSION}" \
            --notes "Signed InstaEclipse Android APK. Native Android UI and runtime are shipped together; no Web Manager/WebView UI is required."
