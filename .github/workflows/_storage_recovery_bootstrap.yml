name: Temporary storage recovery bootstrap
on:
  push:
    branches: [main]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stability/latest-instagram
          fetch-depth: 0
      - name: Apply SAF recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ps/reso/instaeclipse/mods/media/DownloadSaveService.java')
          s = p.read_text()
          old = '''            Uri uri = writeViaSaf(tmp, detected.filename, detected.mimeType,
                    saveUri, username, usernameFolder);
            return new SavedMedia(uri, detected.filename, detected.mimeType);'''
          new = '''            Uri uri;
            try {
                uri = writeViaSaf(tmp, detected.filename, detected.mimeType,
                        saveUri, username, usernameFolder);
            } catch (Exception safError) {
                if (!isSafWriteFailure(safError)) throw safError;
                ModuleLog.line("(IE|DL|Storage) SAF unavailable; falling back to Downloads: " + safError.getMessage());
                uri = DownloadStorageFallback.saveToDownloads(this, tmp, detected.filename, detected.mimeType);
            }
            return new SavedMedia(uri, detected.filename, detected.mimeType);'''
          old2 = '''            Uri uri = writeViaSaf(out, corrected, "video/mp4",
                    saveUri, username, usernameFolder);
            return new SavedMedia(uri, corrected, "video/mp4");'''
          new2 = '''            Uri uri;
            try {
                uri = writeViaSaf(out, corrected, "video/mp4",
                        saveUri, username, usernameFolder);
            } catch (Exception safError) {
                if (!isSafWriteFailure(safError)) throw safError;
                ModuleLog.line("(IE|DL|Storage) SAF unavailable after merge; falling back to Downloads: " + safError.getMessage());
                uri = DownloadStorageFallback.saveToDownloads(this, out, corrected, "video/mp4");
            }
            return new SavedMedia(uri, corrected, "video/mp4");'''
          marker = '''    // ── SAF write ────────────────────────────────────────────────────────────
'''
          helper = '''    private static boolean isSafWriteFailure(Exception e) {
        String m = e.getMessage();
        return m != null && (m.contains("SAF folder not writable")
                || m.contains("SAF createFile returned null")
                || m.contains("SAF openOutputStream returned null")
                || m.contains("Cannot create username sub-folder"));
    }

'''
          if 'isSafWriteFailure(Exception e)' not in s:
              if marker not in s: raise SystemExit('SAF marker missing')
              s = s.replace(marker, helper + marker, 1)
          if old in s:
              s = s.replace(old, new, 1)
          elif 'SAF unavailable; falling back to Downloads' not in s:
              raise SystemExit('single-stream block missing')
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif 'SAF unavailable after merge; falling back to Downloads' not in s:
              raise SystemExit('merged block missing')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/ps/reso/instaeclipse/mods/media/DownloadSaveService.java
          if ! git diff --cached --quiet; then
            git commit -m 'fix(storage): recover downloads when SAF permission is revoked'
            git push origin HEAD:stability/latest-instagram
          fi
      - name: Remove temporary bootstrap
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git rm .github/workflows/_storage_recovery_bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary storage recovery bootstrap'
          git push origin HEAD:main
