name: Build Web Manager

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'postcss.config.*'
      - 'eslint.config.*'
      - '.github/workflows/web-manager.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - 'postcss.config.*'
      - 'eslint.config.*'
      - '.github/workflows/web-manager.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Web Manager
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Verify production bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -n "$(find dist/assets -type f | head -n 1)"
          grep -q 'InstaEclipse' dist/index.html
          echo 'Web Manager production bundle verified.'

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-web-manager-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14
