name: Build & Verify Debug APK

on:
  push:
    branches:
      - main
      - 0.4
      - 'stability/latest-instagram'
  pull_request:
    branches:
      - main
      - 'stability/latest-instagram'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build Web Manager APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Web Manager
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run lint
          bun run build
          test -s dist/index.html
          test -n "$(find dist/assets -type f -print -quit)"
          rm -rf app/src/main/assets/web app/src/main/assets/www
          mkdir -p app/src/main/assets/web app/src/main/assets/www
          cp -R dist/. app/src/main/assets/web/
          cp -R dist/. app/src/main/assets/www/
          test -s app/src/main/assets/web/index.html
          test -s app/src/main/assets/www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:lintDebug --no-daemon --stacktrace || true

      - name: Build unsigned Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Android APK contains Web Manager
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/web/index.html'
          unzip -l "$APK" | grep -q 'assets/web/assets/'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'ps.reso.instaeclipse.MainActivity' /tmp/manifest.txt
          PACKAGE=$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          VERSION=$("$AAPT" dump badging "$APK" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p")
          EXPECTED_VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*['\"]\\([^'\"]*\\)['\"].*/\\1/p" app/build.gradle | head -n1)
          test "$PACKAGE" = "ps.reso.instaeclipse"
          test "$VERSION" = "$EXPECTED_VERSION"
          echo "Web Manager Android APK verified; package=$PACKAGE version=$VERSION"

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
