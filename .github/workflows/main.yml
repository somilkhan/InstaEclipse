name: Build & Verify Debug APK

on:
  push:
    branches:
      - main
      - 0.4
      - 'stability/latest-instagram'
  pull_request:
    branches:
      - main
      - 'stability/latest-instagram'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply SAF storage recovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/ps/reso/instaeclipse/mods/media/DownloadSaveService.java')
          s = p.read_text()
          old = '''            Uri uri = writeViaSaf(tmp, detected.filename, detected.mimeType,
                    saveUri, username, usernameFolder);
            return new SavedMedia(uri, detected.filename, detected.mimeType);'''
          new = '''            Uri uri;
            try {
                uri = writeViaSaf(tmp, detected.filename, detected.mimeType,
                        saveUri, username, usernameFolder);
            } catch (Exception safError) {
                if (!isSafWriteFailure(safError)) throw safError;
                ModuleLog.line("(IE|DL|Storage) SAF unavailable; falling back to Downloads: " + safError.getMessage());
                uri = DownloadStorageFallback.saveToDownloads(this, tmp, detected.filename, detected.mimeType);
            }
            return new SavedMedia(uri, detected.filename, detected.mimeType);'''
          old2 = '''            Uri uri = writeViaSaf(out, corrected, "video/mp4",
                    saveUri, username, usernameFolder);
            return new SavedMedia(uri, corrected, "video/mp4");'''
          new2 = '''            Uri uri;
            try {
                uri = writeViaSaf(out, corrected, "video/mp4",
                        saveUri, username, usernameFolder);
            } catch (Exception safError) {
                if (!isSafWriteFailure(safError)) throw safError;
                ModuleLog.line("(IE|DL|Storage) SAF unavailable after merge; falling back to Downloads: " + safError.getMessage());
                uri = DownloadStorageFallback.saveToDownloads(this, out, corrected, "video/mp4");
            }
            return new SavedMedia(uri, corrected, "video/mp4");'''
          marker = '''    // ── SAF write ────────────────────────────────────────────────────────────
'''
          helper = '''    private static boolean isSafWriteFailure(Exception e) {
        String m = e.getMessage();
        return m != null && (m.contains("SAF folder not writable")
                || m.contains("SAF createFile returned null")
                || m.contains("SAF openOutputStream returned null")
                || m.contains("Cannot create username sub-folder"));
    }

'''
          changed = False
          if 'isSafWriteFailure(Exception e)' not in s:
              if marker not in s: raise SystemExit('SAF marker missing')
              s = s.replace(marker, helper + marker, 1)
              changed = True
          if old in s:
              s = s.replace(old, new, 1)
              changed = True
          if old2 in s:
              s = s.replace(old2, new2, 1)
              changed = True
          p.write_text(s)
          print('storage patch changed:', changed)
          PY
          if git diff --quiet -- app/src/main/java/ps/reso/instaeclipse/mods/media/DownloadSaveService.java; then
            echo 'Storage recovery already integrated.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add app/src/main/java/ps/reso/instaeclipse/mods/media/DownloadSaveService.java
            git commit -m 'fix(storage): recover downloads when SAF permission is revoked'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
