name: Build & Verify Debug APK

on:
  push:
    branches:
      - main
      - 0.4
      - 'stability/latest-instagram'
  pull_request:
    branches:
      - main
      - 'stability/latest-instagram'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK tooling
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Prepare release signing key
        env:
          KEYSTORE_B64: ${{ secrets.INSTAECLIPSE_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "INSTAECLIPSE_KEYSTORE_BASE64 is required"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/instaeclipse-release.jks
          test -s /tmp/instaeclipse-release.jks

      - name: Build signed Debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.INSTAECLIPSE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSTAECLIPSE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSTAECLIPSE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Core signing secrets are required"; exit 1; }
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -PcoreReleaseStoreFile=/tmp/instaeclipse-release.jks \
            -PcoreReleaseStorePassword="$KEYSTORE_PASSWORD" \
            -PcoreReleaseKeyAlias="$KEY_ALIAS" \
            -PcoreReleaseKeyPassword="$KEY_PASSWORD"

      - name: Verify native Android APK and reject Web Manager
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump xmltree "$APK" AndroidManifest.xml > /tmp/manifest.txt
          grep -q 'ps.reso.instaeclipse.MainActivity' /tmp/manifest.txt
          ! unzip -l "$APK" | grep -q 'assets/web/index.html'
          ! unzip -l "$APK" | grep -q 'assets/web/'
          echo "Native Android UI verified; Web Manager runtime is not packaged"

      - name: Upload Core APK
        uses: actions/upload-artifact@v4
        with:
          name: instaeclipse-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
