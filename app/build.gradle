plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 35

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 35
        versionCode 24
        versionName '2.0.4'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty('coreReleaseStoreFile')
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty('coreReleaseStorePassword')
                keyAlias project.findProperty('coreReleaseKeyAlias')
                keyPassword project.findProperty('coreReleaseKeyPassword')
            }
        }
    }

    lint {
        disable 'MissingTranslation'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
