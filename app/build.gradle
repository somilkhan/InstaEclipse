plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'ps.reso.instaeclipse'
    compileSdk 35

    defaultConfig {
        applicationId "ps.reso.instaeclipse"
        minSdkVersion 28
        targetSdk 35
        versionCode 16
        versionName '0.6.0'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lint {
        // The default values/strings.xml is the intentional fallback for locales
        // whose translation is incomplete. Missing translations must not block a
        // release; actual resource/API correctness issues remain fatal.
        disable 'MissingTranslation'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation project(':plugin-api')
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.gson
    implementation libs.dexkit
    implementation "androidx.documentfile:documentfile:1.1.0"
    implementation libs.osmdroid
    implementation libs.fileprefs

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core.v361

    compileOnly files('libs/api-82.jar')
}
