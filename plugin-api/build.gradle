plugins {
    id 'com.android.library' version '8.11.1'
}

android {
    namespace 'ps.reso.instaeclipse.plugin.api'
    compileSdk 35

    defaultConfig {
        minSdk 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
